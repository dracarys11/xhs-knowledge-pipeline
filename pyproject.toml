[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-ingest"
version = "0.1.0"
description = "Xiaohongshu personal favorites knowledge acquisition system - P0 Vertical Slice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
xhs-ingest = "xhs_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
